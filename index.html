<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>SoulcityTech | Cybersecurity, Cloud, Hardware &amp; Software, Digital Marketing</title>
    <meta
      name="description"
      content="SoulcityTech helps businesses and individuals with cybersecurity, cloud solutions, hardware and software, and digital marketing. Book a free consultation or chat on WhatsApp."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SoulcityTech" />
    <meta property="og:title" content="SoulcityTech | Smarter Technology. Stronger Security. Faster Growth." />
    <meta
      property="og:description"
      content="Cybersecurity, cloud solutions, hardware and software, and digital marketing for businesses and individuals."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SoulcityTech — Smarter Technology. Stronger Security. Faster Growth." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/images/og-image.png" />

    <!-- Structured data: only facts we can verify (name). Extend once contact details are confirmed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SoulcityTech",
        "url": "%SITE_URL%/",
        "description": "Technology solutions and digital marketing company serving businesses and individuals."
      }
    </script>

    <noscript>
      <style>
        .reveal { opacity: 1 !important; transform: none !important; }
        .hero-appear { opacity: 1 !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif;color:#f8fafc">
        SoulcityTech works best with JavaScript enabled. Please enable it, or contact us directly.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
